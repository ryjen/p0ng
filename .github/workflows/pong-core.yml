name: PongCore portable tests

on:
  pull_request:
    paths:
      - 'modern/**'
      - '.github/workflows/pong-core.yml'
  push:
    branches: [master]
    paths:
      - 'modern/**'
      - '.github/workflows/pong-core.yml'

permissions:
  contents: read

jobs:
  core-tests:
    name: Swift 6.2.1 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: swift:6.2.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test PongCore
        run: swift test --package-path modern -j 2
