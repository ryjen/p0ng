name: p0ng validation

on:
  pull_request:
    paths:
      - 'modern/**'
      - '.github/workflows/pong-core.yml'
  push:
    branches: [main]
    paths:
      - 'modern/**'
      - '.github/workflows/pong-core.yml'

concurrency:
  group: p0ng-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Swift 6.2.1 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: swift:6.2.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test PongCore
        run: swift test --package-path modern -j 2

  ios-simulator-build:
    name: iOS Simulator build and UI smoke
    runs-on: macos-15
    timeout-minutes: 35
    # The runner's default Xcode can drift. Fail closed if this supported
    # version is removed, rather than silently changing compiler/SDK behavior.
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify pinned Xcode
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"
      - name: Install pinned XcodeGen 2.46.0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen-2.46.0.zip"
          destination="$RUNNER_TEMP/pinned-xcodegen"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          # Digest published with the upstream GitHub release asset.
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $archive" | shasum -a 256 -c -
          mkdir -p "$destination"
          ditto -x -k "$archive" "$destination"
          bin="$(find "$destination" -type f -name xcodegen | head -n 1)"
          test -n "$bin"
          test -x "$bin"
          "$bin" --version | grep -F "2.46.0"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Generate project
        working-directory: modern
        run: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator
        working-directory: modern
        run: |
          set -o pipefail
          xcodebuild -project p0ng-modern.xcodeproj -scheme p0ng -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS Simulator UI smoke
        working-directory: modern
        env:
          UI_RESULTS: ${{ runner.temp }}/p0ng-ui-smoke.xcresult
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if k.startswith("com.apple.CoreSimulator.SimRuntime.iOS") for x in v if "iPhone" in x["name"] and x.get("isAvailable", False)))')"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project p0ng-modern.xcodeproj -scheme p0ng -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath .derivedData -resultBundlePath "$UI_RESULTS" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -only-testing:p0ngUnitTests -only-testing:p0ngUITests/P0ngSmokeUITests test
